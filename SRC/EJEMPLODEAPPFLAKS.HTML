
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <h1 class="text-center mt-5 mb-3 text-primary">
        EJEMPLO DE APP FLAKS
    </h1>

    <div class="container">

        <div class="card shadow">

            <div class="card-body">

                <!-- Formulario -->
                <form action="" method="POST">

                    <div class="row mb-3">

                        <div class="col">
                            <label>País Id:</label>
                            <input type="text"
                                   class="form-control mb-3"
                                   name="Id">
                        </div>

                        <div class="col">
                            <label>País Nombre:</label>
                            <input type="text"
                                   class="form-control mb-3"
                                   name="PaisNombre">
                        </div>

                        <div class="col">
                            <label>País Sigla:</label>
                            <input type="text"
                                   class="form-control mb-3"
                                   name="PaisSigla">
                        </div>

                        <div class="col">
                            <button class="btn btn-primary mb-3 mt-4"
                                    type="submit">
                                Guardar
                            </button>
                        </div>

                    </div>

                </form action="/insertPais" method="POST">

                <!-- Tabla -->
                <table class="table table-bordered">

                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">País Nombre</th>
                            <th scope="col">País Sigla</th>
                            <th scope="col">Editar</th>
                            <th scope="col">Eliminar</th>
                        </tr>
                    </thead>

                    <tbody>
                         <!--declara un bucle-->
                         {% for d in data %}
                        <tr>
                            <td>{{d.id_pais}}</td>
                            <td>{{d.nombre_pais}}</td>
                            <td>{{d.siglas_pais}}</td>
                            <td><button= class="btn btn-primary btn-sm" id="">Editar</button></td>
                            <td><a href="”',  class = "btn btn-danger btn-sm">Eliminar</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
